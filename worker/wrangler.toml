# Worker de «Català ⇄ 中文»: proxy de Claude Haiku 5.5 + caché KV + sincronización D1.
# Pasos completos en README.md.
name = "catala-zh-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Variables no secretas. Los secretos (ANTHROPIC_API_KEY, ALLOWED_CODES) van con
# `npx wrangler secret put <NOMBRE>`; en local, en el archivo .dev.vars.
[vars]
DAILY_LIMIT = "150"
# Origen de la PWA en producción (sin barra final): el Worker de assets `catala-zh` (app/wrangler.toml).
ALLOWED_ORIGIN = "https://catala-zh.arnau-montull.workers.dev"
MOCK_AI = "0"

# KV para la caché de respuestas y los contadores diarios.
# Crear con:  npx wrangler kv namespace create CACHE
# y pegar aquí el "id" que imprime.
[[kv_namespaces]]
binding = "CACHE"
id = "1be2b12ca558491db143d0caa2dbe897"

# D1 para las tarjetas.
# Crear con:  npx wrangler d1 create catala_zh
# y pegar aquí el "database_id" que imprime.
# Migración:  npx wrangler d1 migrations apply catala_zh --remote
[[d1_databases]]
binding = "DB"
database_name = "catala_zh"
database_id = "9c74a66e-e3f6-452b-82e2-696b27e41137"
migrations_dir = "migrations"
